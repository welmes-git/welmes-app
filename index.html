<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WELMES - Japanese Cosmetics Wholesale Platform</title>
    <meta name="description" content="WELMES - Japanese Cosmetics Wholesale Platform for global B2B buyers." />
    <meta property="og:title" content="WELMES - Japanese Cosmetics Wholesale Platform" />
    <meta property="og:description" content="WELMES - Japanese Cosmetics Wholesale Platform for global B2B buyers." />
    <meta property="og:site_name" content="WELMES" />
    <!-- Pretendard: the de facto Korean e-commerce UI face. Dynamic subset only fetches the Hangul blocks a page uses -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- UI + display type. Free stand-ins for Faire's licensed Graphik (UI) and Nantes (display):
         Hanken Grotesk and Newsreader. Neither has Hangul/Kana, so those fall back to Pretendard. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400&display=swap" />
    <!-- Logo wordmark only: one weight, text limited to the letters it draws -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&text=WELMS&display=swap" />
    <!-- Japanese needs JP kanji/kana forms (Pretendard KR draws them Korean-style and lacks many kanji).
         Dynamic subset like the KR file; the old static file pulled whole multi-MB weights. -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
